# Weekly fuzzing: every fuzz target from the seed corpus (fuzz/, CONTRIBUTING.md
# "Fuzzing"), 300 s for the stateful ones, 60 s for the others. Scheduled runs
# only on the maintainer's Gitea (repository variable CI_RUNNER); elsewhere only
# when started by hand, as the job is not tested on GitHub-hosted runners.
# Nightly and cargo-fuzz are pinned. With FUZZ_CORPUS set (a directory on the
# self-hosted runner) the corpus each target grows is kept there and minimised
# after every run; without it new inputs stay in the runner's temp directory.
name: Fuzz
on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # Set on the maintainer's Gitea only (repository variable).
  FUZZ_CORPUS: ${{ vars.FUZZ_CORPUS }}

jobs:
  fuzz:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: vars.CI_RUNNER != '' || github.event_name == 'workflow_dispatch'
    # 3 x 300 s + 9 x 60 s of fuzzing, plus toolchain, build and minimising.
    timeout-minutes: 50
    env:
      FUZZ_TOOLCHAIN: nightly-2026-09-28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          "$HOME/.cargo/bin/cargo" "+$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked

      - name: Run targets
        working-directory: fuzz
        run: |
          set -euo pipefail
          corpus=${FUZZ_CORPUS:-$RUNNER_TEMP/corpus}
          cargo "+$FUZZ_TOOLCHAIN" fuzz build -O
          for t in $(cargo "+$FUZZ_TOOLCHAIN" fuzz list); do
            case $t in
              relay_guard | imap_preauth | sieve_preauth) secs=300 ;;
              *) secs=60 ;;
            esac
            args=(-max_total_time="$secs" -rss_limit_mb=1024)
            [ ! -f "dict/$t.dict" ] || args+=("-dict=dict/$t.dict")
            mkdir -p "$corpus/$t"
            cargo "+$FUZZ_TOOLCHAIN" fuzz run -O "$t" "$corpus/$t" "corpus/$t" -- "${args[@]}"
            # Keep only inputs that add coverage, so the kept corpus does not
            # grow from week to week.
            [ -z "$FUZZ_CORPUS" ] || cargo "+$FUZZ_TOOLCHAIN" fuzz cmin -O "$t" "$corpus/$t" -- -rss_limit_mb=1024
          done
