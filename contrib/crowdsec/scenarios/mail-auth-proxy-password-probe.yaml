# Password credentials sent where the proxy does not offer them. Clients that
# honour the advertised mechanisms never send these, so repeated ones are
# likely scanning for weak password endpoints (for example on an OAuth-only
# public endpoint). Internal sources (scope.internal_networks) do not count.
type: leaky
name: mail-auth-proxy/password-probe
description: "mail-auth-proxy: passwords from an external IP sent to an endpoint that does not offer them"
filter: "evt.Meta.log_type == 'mail_auth_proxy_auth' && evt.Meta.auth_scope == 'external' && evt.Meta.log_subtype == 'blocked_endpoint'"
groupby: evt.Meta.source_ip
capacity: 3
leakspeed: 1m
blackhole: 10m
labels:
  service: mail-auth-proxy
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1595
    - attack.T1110
  label: "Mail password probing"
  behavior: "generic:scan"
  remediation: true
