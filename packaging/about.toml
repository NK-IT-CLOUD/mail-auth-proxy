# cargo-about 0.9 (`cargo-about generate`, run by packaging/build.sh in the build
# container, offline). Produces THIRD-PARTY-NOTICES.html for the crates in the
# release binary.

# Same licenses as [licenses] allow in deny.toml, in order of preference for
# crates that offer a choice. A crate outside this list fails the build.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
# The release binary is built for this target only.
targets = ["x86_64-unknown-linux-musl"]
# Build scripts, proc-macro helpers used only at build time and test crates do
# not end up in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
