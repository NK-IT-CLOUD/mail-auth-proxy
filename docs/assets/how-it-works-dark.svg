<text class="c" x="921" y="224">ManageSieve</text>
<rect class="box" x="866" y="326" width="110" height="72" rx="8"/>
<text class="h c" x="921" y="358">Postfix</text>
<text class="c" x="921" y="378">submission</text>
</g>
