<text class="h" x="304" y="276">SASL</text>
<text class="h" x="304" y="293">mechanism</text>
<path class="l" d="M276 262V198H444"/>
<path class="l" d="M276 298V362H444"/>
<text class="e" x="286" y="174">XOAUTH2 /</text>
<text class="e" x="286" y="190">OAUTHBEARER</text>
<text class="e" x="286" y="354">PLAIN / LOGIN</text>
<text class="n e" x="286" y="380">only where a rule allows</text>
<rect class="in" x="446" y="162" width="168" height="72" rx="8"/>
<text class="h c" x="530" y="188">Validate JWT locally</text>
<text class="c" x="530" y="208">signature via JWKS,</text>
<text class="c" x="530" y="224">iss, aud, exp, …</text>
<rect class="in" x="446" y="326" width="168" height="72" rx="8"/>
<text class="h c" x="530" y="352">Legacy gate</text>
<text class="c" x="530" y="372">rules, domains,</text>
<text class="c" x="530" y="388">account, throttle</text>
<path class="l" d="M614 198H646"/>
<path class="l" d="M614 362H646"/>
<rect class="in" x="648" y="162" width="112" height="236" rx="8"/>
<text class="h c" x="704" y="250">Backend</text>
<text class="h c" x="704" y="268">login</text>
<text class="c" x="704" y="292">with the</text>
<text class="c" x="704" y="308">client's own</text>
<text class="c" x="704" y="324">credential</text>
<rect class="box" x="440" y="20" width="180" height="56" rx="8"/>
<text class="h c" x="530" y="44">Identity provider</text>
<text class="c" x="530" y="62">e.g. Keycloak</text>
<path class="k" d="M530 76V160"/>
