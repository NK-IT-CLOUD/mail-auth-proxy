# The maintainer's canonical CI on a self-hosted runner: reproducible builds, deb/rpm
# install tests and the leak gate. Pull requests on GitHub run .github/workflows/ci.yml.
name: CI
on:
  push:
    # main: the public repository; master: the private repository until it is retired.
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Builds run on the build runner (host mode, user `runner`), never in the Gitea
  # container. rustup installs the toolchain pinned in rust-toolchain.toml
  # (with rustfmt and clippy) on first use.
  check:
    runs-on: nkit-build
    # Host-mode runner: never for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Outside the workspace, which is wiped per job; keeps builds incremental.
      CARGO_TARGET_DIR: /home/runner/.cache/mail-auth-proxy/target
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/cargo" --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: |
          cargo build --release --locked
          "$CARGO_TARGET_DIR/release/mail-auth-proxy" --version
          sha256sum "$CARGO_TARGET_DIR/release/mail-auth-proxy"

      - name: Example config is valid
        run: |
          # The example names TLS files that do not exist here; everything else
          # must pass.
          out=$("$CARGO_TARGET_DIR/release/mail-auth-proxy" --check-config examples/config.example.toml 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -E '^  - ' | grep -v -E '^  - tls\.(cert|key):'; then
            echo "FAIL: examples/config.example.toml has problems besides the TLS files"
            exit 1
          fi

  # Nothing private in the public file set (packaging/public-files.txt, built by
  # packaging/public-tree.sh). The patterns live outside the repository (secrets);
  # without them the job fails.
  leak-gate:
    runs-on: nkit-build
    # Host-mode runner: never for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Self-test
        run: packaging/leak-gate-test.sh

      - name: Public file set
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          LEAK_ALLOW: ${{ secrets.LEAK_ALLOW }}
        run: |
          set -euo pipefail
          pub=$(mktemp -d)
          trap 'rm -rf "$pub"' EXIT
          packaging/public-tree.sh HEAD "$pub/tree"
          (cd "$pub/tree" && "$GITHUB_WORKSPACE/packaging/leak-gate.sh" HEAD)

  # Two hermetic builds of the same commit must give the same bytes: the binary,
  # the third-party notices, and the deb and rpm built from them with the commit's
  # SOURCE_DATE_EPOCH. The build image is packaging/build-image (no override).
  # Not for pull requests (two full builds): pushes and manual runs.
  reproducible:
    runs-on: nkit-build
    if: github.event_name != 'pull_request'
    env:
      CONTAINER_ENGINE: buildah
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          f=nfpm_2.47.0_Linux_x86_64.tar.gz
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/$f"
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  $f" | sha256sum -c
          tar -xzf "$f" -C bin nfpm
          f=cargo-auditable-x86_64-unknown-linux-musl.tar.xz
          curl -fsSLO "https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.6/$f"
          echo "42b66c852fbb9074a9ca356279a92eb753f48dde16017b8c82f48dcd05d6c856  $f" | sha256sum -c
          tar -xJf "$f" -C bin --strip-components=1 cargo-auditable-x86_64-unknown-linux-musl/cargo-auditable
          f=cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$f"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $f" | sha256sum -c
          tar -xzf "$f" -C bin --strip-components=1 cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build twice and compare
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          for n in 1 2; do
            AUDITABLE_BIN="$RUNNER_TEMP/bin/cargo-auditable" ABOUT_BIN="$RUNNER_TEMP/bin/cargo-about" \
              packaging/build.sh "repro$n"
            mkdir -p "repro$n/pkg"
            mkdir -p dist && cp "repro$n/mail-auth-proxy" "repro$n/THIRD-PARTY-NOTICES.html" dist/
            for p in deb rpm; do VERSION=0.0.0-repro.1 nfpm package -f packaging/nfpm.yaml -p "$p" -t "repro$n/pkg/"; done
            rm -rf dist
          done
          (cd repro1 && sha256sum mail-auth-proxy THIRD-PARTY-NOTICES.html pkg/*) | tee sums1
          (cd repro2 && sha256sum mail-auth-proxy THIRD-PARTY-NOTICES.html pkg/*) > sums2
          diff sums1 sums2 || { echo "FAIL: builds differ"; exit 1; }

  # Licenses, bans (ring, openssl-sys, rsa), sources and RUSTSEC advisories
  # (deny.toml). Pinned release binary, checksum-verified.
  deny:
    runs-on: nkit-build
    # Host-mode runner: never for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # cargo-deny runs `cargo metadata`, so cargo must be on PATH.
      - name: Toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/cargo" --version

      - name: cargo-deny
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          f=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$f"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $f" | sha256sum -c
          tar -xzf "$f"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" check

  # rust-version in Cargo.toml.
  msrv:
    runs-on: nkit-build
    # Host-mode runner: never for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CARGO_TARGET_DIR: /home/runner/.cache/mail-auth-proxy/target-msrv
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: cargo +1.88.0 check
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.88.0 --profile minimal
          "$HOME/.cargo/bin/cargo" +1.88.0 check --locked --all-targets

  # Static musl build in the digest-pinned image, deb + rpm with nfpm, then
  # install, upgrade and remove in throwaway containers (assertions in
  # packaging/smoke-test.sh).
  package-smoke:
    runs-on: nkit-build
    # Host-mode runner: never for pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CONTAINER_ENGINE: buildah
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          f=nfpm_2.47.0_Linux_x86_64.tar.gz
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/$f"
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  $f" | sha256sum -c
          tar -xzf "$f" -C bin nfpm
          f=cargo-auditable-x86_64-unknown-linux-musl.tar.xz
          curl -fsSLO "https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.6/$f"
          echo "42b66c852fbb9074a9ca356279a92eb753f48dde16017b8c82f48dcd05d6c856  $f" | sha256sum -c
          tar -xJf "$f" -C bin --strip-components=1 cargo-auditable-x86_64-unknown-linux-musl/cargo-auditable
          f=cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$f"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $f" | sha256sum -c
          tar -xzf "$f" -C bin --strip-components=1 cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          AUDITABLE_BIN="$RUNNER_TEMP/bin/cargo-auditable" ABOUT_BIN="$RUNNER_TEMP/bin/cargo-about" \
            packaging/build.sh dist
          dist/mail-auth-proxy --version
          grep -c '<h3 id=' dist/THIRD-PARTY-NOTICES.html

      - name: Package
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          # ci.0 is the older version for the upgrade test.
          for v in 0.0.0-ci.0 "0.0.0-ci.${{ github.run_number }}"; do
            mkdir -p "dist/$v"
            for p in deb rpm; do VERSION=$v nfpm package -f packaging/nfpm.yaml -p "$p" -t "dist/$v/"; done
          done
          ls -l dist/*/

      - name: Install tests
        run: |
          set -euo pipefail
          commit=$(git rev-parse --short=12 HEAD)
          new="dist/0.0.0-ci.${{ github.run_number }}"
          ctr=
          trap '[ -z "$ctr" ] || buildah rm "$ctr" >/dev/null' EXIT
          smoke() { # image, prepare command, package format, expected preinstall branch
            ctr=$(buildah from --quiet "$1")
            buildah run "$ctr" -- sh -c "$2"
            buildah copy --quiet "$ctr" packaging/smoke-test.sh /pkg/smoke-test.sh
            buildah copy --quiet "$ctr" dist/0.0.0-ci.0/*."$3" "/pkg/old.$3"
            buildah copy --quiet "$ctr" "$new"/*."$3" "/pkg/new.$3"
            buildah run "$ctr" -- sh /pkg/smoke-test.sh "/pkg/old.$3" "/pkg/new.$3" "$commit" "$4"
            buildah rm "$ctr" >/dev/null
            ctr=
          }
          # Debian without systemd takes the useradd branch; Ubuntu and Rocky
          # get systemd so preinstall uses systemd-sysusers.
          smoke docker.io/library/debian:12@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26 \
            true deb useradd
          smoke docker.io/library/ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3 \
            'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq systemd >/dev/null' deb systemd-sysusers
          smoke docker.io/rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f \
            'dnf install -y -q systemd >/dev/null' rpm systemd-sysusers
