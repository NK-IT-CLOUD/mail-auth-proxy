# Parses the `authresult` line of mail-auth-proxy (docs/operations.md, "The authresult line").
# The pattern is anchored at the start of the message up to `authlog: authresult `: the
# timestamp, the level and the target `authlog` that the proxy writes before its own
# `authresult` event. The same text elsewhere in a line (in another target's line, or
# after other content on an `authlog` line) does not match.
# `pwfp`, `rule`, `listener`, `backend` and `tls` follow `reason`; the pattern treats
# them as optional, so lines of older releases parse as well. Fields appended later are
# ignored.
onsuccess: next_stage
name: mail-auth-proxy/logs
description: "Parse mail-auth-proxy authentication results"
filter: "evt.Parsed.program == 'mail-auth-proxy' && evt.Parsed.message contains 'authresult result='"
grok:
  pattern: '^%{TIMESTAMP_ISO8601}\s+(?:INFO|WARN)\s+authlog: authresult result="%{WORD:auth_result}" proto="%{WORD:proto}" scope="%{WORD:auth_scope}" mech=%{NOTSPACE:mech} user=%{DATA:username} peer=%{IP:source_ip} reason="%{WORD:reason}"( pwfp="%{DATA:pwfp}")?( rule="%{DATA:rule}")?( listener="%{WORD:listener}")?( backend="%{DATA:backend}")?( tls="%{DATA:tls}")?'
  apply_on: message
statics:
  - meta: service
    value: mail-auth-proxy
  - meta: log_type
    value: mail_auth_proxy_auth
  - meta: log_subtype
    expression: evt.Parsed.reason
  - meta: source_ip
    expression: evt.Parsed.source_ip
  - meta: username
    expression: evt.Parsed.username
  - meta: auth_result
    expression: evt.Parsed.auth_result
  - meta: auth_scope
    expression: evt.Parsed.auth_scope
  - meta: proto
    expression: evt.Parsed.proto
