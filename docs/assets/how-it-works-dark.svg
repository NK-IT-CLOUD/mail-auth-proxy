<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t d">
<title id="t">How mail-auth-proxy works</title>
<desc id="d">Mail clients connect over TLS to mail-auth-proxy on ports 993, 587 and 4190. The SASL mechanism picks the path: XOAUTH2 or OAUTHBEARER tokens are validated locally against the identity provider's JWKS; PLAIN or LOGIN go through the legacy gate only where a rule allows. The proxy then logs in to Dovecot (PROXY protocol v2) or Postfix submission (XCLIENT) over verified TLS with the client's own credential.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#656c76"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="#4493f8"/></marker>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;font-size:12.5px;fill:#9198a1}
.h{font-size:14px;font-weight:600;fill:#f0f6fc}
.p{font-size:15px;font-weight:600;fill:#4493f8}
.c{text-anchor:middle}
.n{font-style:italic}
.e{font-size:12px}
.box{fill:#151b23;stroke:#3d444d;stroke-width:1}
.in{fill:#0d1117;stroke:#1f6feb;stroke-width:1}
.l{fill:none;stroke:#656c76;stroke-width:1.25;marker-end:url(#a)}
.k{fill:none;stroke:#4493f8;stroke-width:1.25;stroke-dasharray:5 4;marker-end:url(#b)}
</style>
<rect class="box" x="16" y="236" width="114" height="88" rx="8"/>
<text class="h c" x="73" y="268">Mail clients</text>
<text class="c" x="73" y="290">Thunderbird,</text>
<text class="c" x="73" y="306">phone, webmail</text>
<text class="c e" x="184" y="270">TLS</text>
<text class="c e" x="184" y="300">993 IMAPS</text>
<text class="c e" x="184" y="316">587 submission</text>
<text class="c e" x="184" y="332">4190 ManageSieve</text>
<g transform="translate(10 0)">
<rect x="240" y="120" width="536" height="320" rx="14" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
<text class="p" x="258" y="146">mail-auth-proxy</text>
<text class="c n" x="508" y="426">Nothing reaches the backend before the check has passed.</text>
