[package]
name = "mail-auth-proxy"
version = "0.5.0"
edition = "2021"
description = "Authentication proxy for IMAP, SMTP submission and ManageSieve: local OAuth2 token validation and an optional password gate"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/NK-IT-CLOUD/mail-auth-proxy"
homepage = "https://github.com/NK-IT-CLOUD/mail-auth-proxy"
readme = "README.md"
keywords = ["imap", "smtp", "oauth2", "proxy", "xoauth2"]
categories = ["email", "network-programming", "authentication"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal", "sync"] }
# aws-lc-rs is the single crypto library in the binary: rustls, jsonwebtoken and
# the authlog HMAC all use it (no ring, no rust_crypto).
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-native-certs = "0.8"
# The DNS names of the served certificates (SNI selection); already in the
# tree through rustls, with the same features.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
# aws_lc_rs, not rust_crypto: rust_crypto pulls in the `rsa` crate, whose RSA is
# not constant-time (RUSTSEC-2023-0071, no upstream fix).
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
# rustls-no-provider: reqwest uses the process-default provider main() installs.
# Roots come from the system store via rustls-platform-verifier (including locally
# installed CAs).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
base64 = "0.23"
ipnet = "2"
aws-lc-rs = "1"
anyhow = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# UTS #46 (IDNA) for the canonical form of domain names; already in the tree
# through url/reqwest, with the same features.
idna = "1.1"
# Clears passwords, tokens and the lines carrying them on drop; already in the
# tree through rustls-pki-types and aws-lc-rs.
zeroize = "1.9"
# TCP keepalive idle/interval/count per socket (tokio sets only on/off);
# already in the tree through tokio, with the same features.
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
# Black-box harness (tests/): certificates for the proxy and the mock
# backends, a scratch directory for them, and the authresult grok regex.
# rcgen on aws-lc-rs like the binary, so no ring in the tree.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1.13.1"
tempfile = "3.27.0"
# Paused clock for the relay's session limits (30 minutes and more).
tokio = { version = "1", features = ["test-util"] }

# `fuzzing` is set by cargo-fuzz (fuzz/): it compiles `src/fuzz_api.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
